<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" role="img" aria-label="Illustration of a secure telemedicine video consultation">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a5d43"/><stop offset="1" stop-color="#0e2318"/>
    </linearGradient>
    <linearGradient id="laptop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15362a"/><stop offset="1" stop-color="#0a1b12"/>
    </linearGradient>
    <linearGradient id="tealg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fb3aa"/><stop offset="1" stop-color="#2e8c86"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#4fb3aa" stop-opacity=".35"/><stop offset="1" stop-color="#4fb3aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="220" cy="150" r="150" fill="url(#glow)"/>

  <!-- floating cards -->
  <g opacity="0.95">
    <rect x="300" y="40" width="112" height="40" rx="12" fill="#ffffff" filter="url(#soft)"/>
    <circle cx="322" cy="60" r="11" fill="url(#tealg)"/>
    <path d="M317 60l3.5 3.5 6-7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="340" y="52" width="58" height="6" rx="3" fill="#2a5d43"/>
    <rect x="340" y="63" width="40" height="5" rx="2.5" fill="#9bbfae"/>
  </g>

  <!-- laptop -->
  <g filter="url(#soft)">
    <rect x="70" y="78" width="300" height="192" rx="16" fill="url(#laptop)"/>
    <rect x="84" y="92" width="272" height="150" rx="10" fill="url(#screen)"/>

    <!-- clinician tile -->
    <rect x="100" y="108" width="118" height="118" rx="10" fill="#ffffff" opacity="0.08"/>
    <circle cx="159" cy="150" r="24" fill="#8fd0bf"/>
    <path d="M127 214c0-19 15-32 32-32s32 13 32 32z" fill="#8fd0bf"/>
    <rect x="116" y="196" width="86" height="9" rx="4.5" fill="url(#tealg)"/>

    <!-- patient tile -->
    <rect x="226" y="108" width="118" height="118" rx="10" fill="#ffffff" opacity="0.08"/>
    <circle cx="285" cy="150" r="24" fill="#d7ece9"/>
    <path d="M253 214c0-19 15-32 32-32s32 13 32 32z" fill="#d7ece9"/>
  </g>
  <!-- laptop base -->
  <path d="M52 270h336l18 22H34z" fill="#0a1b12" filter="url(#soft)"/>
  <rect x="34" y="288" width="372" height="6" rx="3" fill="#153626"/>

  <!-- secure badge -->
  <g transform="translate(292,246)" filter="url(#soft)">
    <rect x="0" y="0" width="104" height="34" rx="17" fill="url(#tealg)"/>
    <path d="M20 17l5 5 9-11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="22" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#fff" font-weight="700">Secure</text>
  </g>
</svg>
